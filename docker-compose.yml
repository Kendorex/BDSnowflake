
services:
  postgres:
    image: postgres:16
    container_name: lab_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  postgres_test_data:
